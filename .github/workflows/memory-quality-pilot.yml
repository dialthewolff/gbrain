name: Memory Quality Pilot

on:
  pull_request:
    paths:
      - 'operator/memory-quality-pilot/**'
      - '.github/workflows/memory-quality-pilot.yml'
  push:
    branches: [master]
    paths:
      - 'operator/memory-quality-pilot/**'
      - '.github/workflows/memory-quality-pilot.yml'

permissions:
  contents: read

jobs:
  python-audit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check Python runtime
        run: python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
      - name: Run synthetic regression suite
        run: python3 -m unittest discover -s operator/memory-quality-pilot/tests -v
      - name: Validate synthetic observations
        run: |
          python3 operator/memory-quality-pilot/scripts/memory_quality_gate.py validate \
            --observations operator/memory-quality-pilot/examples/synthetic_observations.jsonl --json
      - name: Score synthetic retrieval
        run: |
          python3 operator/memory-quality-pilot/scripts/memory_quality_gate.py evaluate \
            --gold operator/memory-quality-pilot/examples/synthetic_gold.jsonl \
            --results operator/memory-quality-pilot/examples/synthetic_results.jsonl --json
